<!DOCTYPE120x160 html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=120, height=160, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StartPage 120x160</title>
  <style>
    /* 120x160 Ekran Sıfırlama */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 10px;
      user-select: none;
    }

    html, body {
      width: 120px;
      height: 160px;
      overflow: hidden;
      background: #000000;
      color: #ffffff;
    }

    .container {
      width: 120px;
      height: 160px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2px;
    }

    /* Üst Bilgi Çubuğu (Saat & Tarih) */
    .header {
      background: #1c1c1e;
      border-radius: 3px;
      padding: 2px 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }

    .clock {
      font-weight: bold;
      color: #00ff66;
      font-size: 11px;
    }

    .date {
      color: #aaa;
      font-size: 8px;
    }

    /* Arama Kutusu */
    .search-form {
      margin: 2px 0;
    }

    .search-input {
      width: 100%;
      height: 18px;
      background: #111;
      border: 1px solid #00ff66;
      border-radius: 2px;
      color: #fff;
      padding: 0 4px;
      font-size: 9px;
      outline: none;
    }

    /* Kısayol Izgarası (2x3 Grid) */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
      flex-grow: 1;
      margin-top: 1px;
    }

    .btn {
      background: #222;
      border: 1px solid #444;
      border-radius: 3px;
      color: #fff;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2px;
      text-align: center;
    }

    .btn:focus, .btn:active {
      background: #00ff66;
      color: #000;
      border-color: #fff;
      font-weight: bold;
    }

    .btn-icon {
      font-size: 12px;
      line-height: 12px;
    }

    .btn-label {
      font-size: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 50px;
    }

    /* Alt Durum Çubuğu */
    .footer {
      background: #111;
      border-top: 1px solid #222;
      font-size: 7px;
      color: #888;
      text-align: center;
      padding: 1px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Üst Bar -->
    <div class="header">
      <span class="clock" id="clock">00:00</span>
      <span class="date" id="date">1 Oca</span>
    </div>

    <!-- Arama Kutusu (Google Arama) -->
    <form class="search-form" action="https://www.google.com/search" method="get">
      <input type="text" name="q" class="search-input" placeholder="Ara veya URL..." autofocus>
    </form>

    <!-- Kısayollar -->
    <div class="grid">
      <a href="https://www.google.com" class="btn">
        <span class="btn-icon">🔍</span>
        <span class="btn-label">Google</span>
      </a>
      <a href="https://m.youtube.com" class="btn">
        <span class="btn-icon">▶</span>
        <span class="btn-label">YouTube</span>
      </a>
      <a href="https://m.wikipedia.org" class="btn">
        <span class="btn-icon">📖</span>
        <span class="btn-label">Wiki</span>
      </a>
      <a href="https://m.facebook.com" class="btn">
        <span class="btn-icon">🌐</span>
        <span class="btn-label">Social</span>
      </a>
      <a href="https://news.google.com" class="btn">
        <span class="btn-icon">📰</span>
        <span class="btn-label">Haberler</span>
      </a>
      <a href="https://weather.com" class="btn">
        <span class="btn-icon">☀️</span>
        <span class="btn-label">Hava</span>
      </a>
    </div>

    <!-- Alt Bilgi -->
    <div class="footer">
      120x160 Mini Web Page
    </div>
  </div>

  <script>
    // Saat ve Tarihi Güncelleme
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}`;

      const months = ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağustos', 'Eyl', 'Ekim', 'Kas', 'Ara'];
      const day = now.getDate();
      const month = months[now.getMonth()];
      document.getElementById('date').textContent = `${day} ${month}`;
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
